<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Password Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1 class="title">🔐 Password Generator</h1>
            <p class="subtitle">Generate secure passwords with customizable options</p>
            
            <div class="password-display">
                <input type="text" id="passwordOutput" readonly placeholder="Your password will appear here">
                <button id="copyBtn" class="icon-btn" title="Copy to clipboard">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                    </svg>
                </button>
            </div>

            <div class="options">
                <div class="option-group">
                    <label for="length">Password Length: <span id="lengthValue">16</span></label>
                    <input type="range" id="length" min="8" max="32" value="16">
                </div>

                <div class="checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="uppercase" checked>
                        <span>Uppercase Letters (A-Z)</span>
                    </label>
                    
                    <label class="checkbox-label">
                        <input type="checkbox" id="lowercase" checked>
                        <span>Lowercase Letters (a-z)</span>
                    </label>
                    
                    <label class="checkbox-label">
                        <input type="checkbox" id="numbers" checked>
                        <span>Numbers (0-9)</span>
                    </label>
                    
                    <label class="checkbox-label">
                        <input type="checkbox" id="symbols" checked>
                        <span>Symbols (!@#$%^&*)</span>
                    </label>
                </div>
            </div>

            <div class="strength-indicator">
                <div class="strength-label">Password Strength:</div>
                <div class="strength-bar">
                    <div id="strengthBar" class="strength-fill"></div>
                </div>
                <div id="strengthText" class="strength-text">Strong</div>
            </div>

            <button id="generateBtn" class="generate-btn">Generate Password</button>
        </div>

        <footer class="footer">
            <p>💡 Tip: Use a unique password for each account and store them securely!</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
